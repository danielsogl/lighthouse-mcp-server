name: Release Please

on:
  push:
    branches:
      - main
  # Manual trigger as backup
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # GitHub token for creating PRs and releases
          token: ${{ secrets.GITHUB_TOKEN }}
          # Use manifest-based configuration (advanced setup)
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Show Release Info
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Release created: ${{ steps.release.outputs.release_created }}"
          echo "Tag: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"
          echo "PR: ${{ steps.release.outputs.pr }}"

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 24 for the publish job specifically: trusted publishing needs npm >= 11.5.1
      # and Node 22 still bundles npm 10.x. Dependency caching is deliberately off, as npm
      # recommends for release builds.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Build project
        run: npm run build

      # Authenticates via OIDC against the trusted publisher configured for this package on
      # npmjs.com, so no NPM_TOKEN is involved. Provenance is generated automatically for
      # trusted publishing, and publishConfig.access in package.json already marks the
      # scoped package public.
      - name: Publish to NPM
        run: npm publish
