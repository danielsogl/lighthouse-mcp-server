name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.test.json

      - name: Run tests with coverage and JUnit output
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=test-results.junit.xml

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == '22.x' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results.junit.xml
          flags: unittests

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Drives the built server over stdio and runs real Lighthouse audits against a
      # locally served fixture, so it needs the Chrome preinstalled on the runner image.
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.d.ts
